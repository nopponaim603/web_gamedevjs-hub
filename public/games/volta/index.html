<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1B1A17" />
  <meta name="description" content="VOLTA — swing tower to tower on live power lines ahead of a thunderstorm. Hold to throw your cable, release to fly, and let go before the lightning runs down the wire. A WPA-poster one-finger arcade." />
  <title>VOLTA: Lineman of the Storm</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <div id="stage"></div>
    <div id="hud">
      <div id="topline"><span id="dist">0 m</span><span id="score">0</span><span id="zone">I · PRAIRIE</span></div>
      <div id="storm"><span id="stormLbl">STORM</span><div id="stormTrack"><div id="stormFill"></div></div><span id="stormGap">90 m</span></div>
      <div id="gear"><span id="gloves" class="hidden">GLOVES</span><span id="combo" class="hidden"></span></div>
      <div id="btns">
        <a href="../index.html" class="btn-hub" onclick="if(window.parent && window.parent!==window){window.parent.postMessage('backToMenu', '*');}" title="Back to Hub" style="color: #94a3b8; text-decoration: none; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 9999px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); display: inline-flex; align-items: center; cursor: pointer;">← MENU</a>
        <button id="btn-lang" type="button" aria-label="Language">中</button>
        <button id="btn-mute" type="button" aria-label="Mute">♪</button>
        <button id="btn-pause" type="button" aria-label="Pause">II</button>
      </div>
      <div id="banner" class="hidden"><div id="bannerKick"></div><div id="bannerMain"></div></div>
      <div id="hint">HOLD TO THROW THE LINE · RELEASE TO FLY</div>
    </div>
    <div id="title">
      <div class="rule"></div>
      <div class="kick">WORKS PROGRESS · RURAL ELECTRIFICATION</div>
      <div class="mast">VOLTA</div>
      <div class="sub">LINEMAN OF THE STORM</div>
      <div class="meta">HOLD · THROW THE LINE &nbsp;&nbsp;·&nbsp;&nbsp; RELEASE · FLY &nbsp;&nbsp;·&nbsp;&nbsp; LET GO BEFORE THE BOLT</div>
      <div class="tip">hold anywhere to begin</div>
      <div class="best hidden" id="titleBest"></div>
      <div class="rule"></div>
    </div>
    <div id="paused" class="hidden"><div>PAUSED</div><div class="small">tap to resume · M mute</div></div>
    <div id="poster" class="hidden" role="dialog" aria-label="Run over">
      <div id="posterKick"></div><div id="posterMast"></div><div id="posterScore"></div><div id="posterStats"></div><div id="posterBest"></div>
      <div id="posterBtns"><button id="btn-again" type="button">PLAY AGAIN</button></div>
    </div>
  </div>
  <script src="./vendor/pixi.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
