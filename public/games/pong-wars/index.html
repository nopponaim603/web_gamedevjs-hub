<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dynamic Pong Wars — Day vs Night Simulation</title>
  <meta name="description" content="Dynamic Pong Wars – a playable, color-customizable twist on Pong Wars where balls conquer opposing territory.">
  <meta name="author" content="Marko Denic (Adapted for GameDevJS Hub)">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="brand">
    <span>⚔️ Dynamic Pong Wars</span>
  </div>
  <div class="top-controls">
    <button id="soundBtn" class="icon-btn" title="Toggle Sound (Mute/Unmute)" aria-label="Toggle Sound">
      <svg id="soundIcon" viewBox="0 0 24 24">
        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
    </button>
    <button id="resetBtn" class="icon-btn" title="Reset Simulation" aria-label="Reset Simulation">
      <svg viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
    <button id="playPauseBtn" class="icon-btn" title="Play / Pause" aria-label="Play / Pause">
      <svg id="pauseIcon" viewBox="0 0 24 24">
        <rect x="6" y="4" width="4" height="16"/>
        <rect x="14" y="4" width="4" height="16"/>
      </svg>
      <svg id="playIcon" viewBox="0 0 24 24" style="display: none;">
        <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>
      </svg>
    </button>
    <button id="configBtn" class="icon-btn" title="Settings & Themes" aria-label="Settings & Themes">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</header>

<div id="configPanel">
  <div class="panel-section-title">Color Palette</div>
  
  <div class="config-row">
    <label>Day Side Color:
      <div class="color-input-wrap">
        <input type="color" id="dayColorInput" class="color-picker" value="#FFFFFF"/>
      </div>
    </label>
  </div>

  <div class="config-row">
    <label>Night Side Color:
      <div class="color-input-wrap">
        <input type="color" id="nightColorInput" class="color-picker" value="#0F172A"/>
      </div>
    </label>
  </div>

  <div class="panel-section-title">Preset Themes</div>
  <div class="theme-presets">
    <button class="theme-btn" data-day="#FFFFFF" data-night="#0F172A">
      <span class="preset-preview" style="background: linear-gradient(135deg, #0F172A 50%, #FFFFFF 50%)"></span> Classic
    </button>
    <button class="theme-btn" data-day="#06B6D4" data-night="#EC4899">
      <span class="preset-preview" style="background: linear-gradient(135deg, #EC4899 50%, #06B6D4 50%)"></span> Cyberpunk
    </button>
    <button class="theme-btn" data-day="#F59E0B" data-night="#1E1B4B">
      <span class="preset-preview" style="background: linear-gradient(135deg, #1E1B4B 50%, #F59E0B 50%)"></span> Sunset
    </button>
    <button class="theme-btn" data-day="#F472B6" data-night="#064E3B">
      <span class="preset-preview" style="background: linear-gradient(135deg, #064E3B 50%, #F472B6 50%)"></span> Sakura
    </button>
    <button class="theme-btn" data-day="#FDE047" data-night="#18181B">
      <span class="preset-preview" style="background: linear-gradient(135deg, #18181B 50%, #FDE047 50%)"></span> Solar
    </button>
    <button class="theme-btn" data-day="#E2E8F0" data-night="#000000">
      <span class="preset-preview" style="background: linear-gradient(135deg, #000000 50%, #E2E8F0 50%)"></span> Yin Yang
    </button>
  </div>

  <div class="panel-section-title">Simulation Speed</div>
  <div class="config-row slider-row">
    <label>Speed: <span id="speedVal">1x</span></label>
    <input type="range" id="speedSlider" min="1" max="5" step="1" value="1"/>
  </div>

  <div class="panel-section-title">Balls Per Team</div>
  <div class="btn-group" id="ballCountGroup">
    <button class="active" data-balls="1">1 vs 1</button>
    <button data-balls="2">2 vs 2</button>
    <button data-balls="4">4 vs 4</button>
  </div>

  <div class="panel-section-title">Grid Resolution</div>
  <div class="btn-group" id="gridSizeGroup">
    <button data-size="16">16x16</button>
    <button class="active" data-size="24">24x24</button>
    <button data-size="32">32x32</button>
  </div>
</div>

<main>
  <div class="arena-container">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    
    <div class="score-bar">
      <div class="score-stats">
        <div class="day-stat">
          <span class="stat-dot" id="dayDot" style="background: var(--day-color);"></span>
          <span>Day: <b id="dayScoreNum">0</b> (<span id="dayPct">50%</span>)</span>
        </div>
        <div class="night-stat">
          <span>Night: <b id="nightScoreNum">0</b> (<span id="nightPct">50%</span>)</span>
          <span class="stat-dot" id="nightDot" style="background: var(--night-color);"></span>
        </div>
      </div>
      <div class="tug-bar-wrap">
        <div class="tug-day" id="tugDay" style="width: 50%;"></div>
        <div class="tug-night" id="tugNight" style="width: 50%;"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  Original Concept by <a href="https://github.com/vnglst/pong-wars" target="_blank" rel="noopener">Koen van Gilst</a> & 
  Enhanced by <a href="https://github.com/markodenic/dynamic-pong-wars" target="_blank" rel="noopener">Marko Denic</a>.
</footer>

<script src="game.js"></script>
</body>
</html>
