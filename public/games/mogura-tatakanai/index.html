<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐾 Mogura Tatakanai - モグラ叩かない (Pet the Mole 3D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container">
      
      <button id="sound-toggle-btn" class="sound-toggle-btn" title="Toggle Sound">🔊</button>
      <canvas id="webgl-canvas"></canvas>
      <div id="vignette-overlay"></div>

      <div id="screen-overlay" class="title-mode">
        <div class="overlay-title" id="overlay-title"></div>
        <div class="overlay-score" id="overlay-score"></div>
        <div class="ranking-card" id="ranking-card">
          <div class="ranking-header">
            <span>🏆</span><span>BEST SCORES</span>
          </div>
          <div class="ranking-list" id="ranking-list"></div>
        </div>
        <button class="action-button" id="action-btn">START</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
