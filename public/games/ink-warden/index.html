<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e9e2d0" />
    <meta
      name="description"
      content="Ink Warden 墨守 — a calligraphy defense game painted in living ink. Your finger is the brush: any stroke is a blade, true glyphs become spells, and beautiful writing makes them stronger."
    />
    <title>Ink Warden 墨守</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="shell" aria-label="Ink Warden">
      <canvas id="paperCanvas" aria-hidden="true"></canvas>
      <canvas id="bgCanvas" aria-hidden="true"></canvas>
      <canvas id="fluidCanvas" aria-hidden="true"></canvas>
      <canvas id="gameCanvas" aria-label="Ink Warden battlefield"></canvas>
      <div id="grain" aria-hidden="true"></div>

      <header id="hud" aria-label="Status">
        <div id="titleBlock" aria-hidden="true">
          <h1 id="titleText">墨守</h1>
          <span id="chapterLabel"></span>
        </div>

        <div id="scoreBlock" aria-live="off">
          <span id="scoreLabel">功德</span>
          <strong id="scoreValue">0</strong>
        </div>

        <div id="hudButtons">
          <a href="../index.html" class="seal-btn" onclick="if(window.parent && window.parent!==window){window.parent.postMessage('backToMenu', '*');}" title="Back to Hub" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;">←</a>
          <button id="langBtn" class="seal-btn" type="button" aria-label="Switch language">EN</button>
          <button id="pauseBtn" class="seal-btn" type="button" aria-label="Pause">停</button>
          <button id="soundBtn" class="seal-btn" type="button" aria-label="Toggle sound">音</button>
        </div>
      </header>

      <div id="inkwell" aria-hidden="true">
        <div id="inkFrame"><div id="inkFill"></div></div>
        <span id="inkGlyph">墨</span>
      </div>

      <div id="comboTag" aria-hidden="true">
        <em id="comboWord">連綿</em>
        <strong id="comboValue">×2</strong>
      </div>

      <div id="banner" aria-live="polite"></div>

      <div id="overlay" hidden>
        <section id="choicePanel" class="panel" hidden>
          <h2 id="choiceTitle">擇 帖</h2>
          <p id="choiceSub"></p>
          <div id="choiceCards"></div>
        </section>

        <section id="pausePanel" class="panel" hidden>
          <h2 id="pauseTitle">小 憩</h2>
          <p id="pauseHint"></p>
          <div id="spellSheet"></div>
          <div class="panel-actions">
            <button id="resumeBtn" class="brush-btn" type="button"></button>
            <button id="restartBtn" class="brush-btn ghost" type="button"></button>
          </div>
        </section>

        <section id="overPanel" class="panel" hidden>
          <h2 id="overTitle">遺 墨</h2>
          <canvas id="relicCanvas" width="10" height="10"></canvas>
          <div id="overStats"></div>
          <div class="panel-actions">
            <button id="againBtn" class="brush-btn" type="button"></button>
            <button id="saveBtn" class="brush-btn ghost" type="button"></button>
          </div>
          <p id="overNote"></p>
        </section>
      </div>
    </main>

    <script src="js/fluid.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
