<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>INKWASH 晕染 (Living Ink Territory Battle)</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="stage">
    <!-- Hub Floating Navigation -->
    <div id="hub-nav-overlay" style="position: fixed; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); z-index: 99999;">
        <button id="hub-back-btn" class="mini" style="background: rgba(30, 41, 59, 0.85); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 9999px; padding: 6px 14px; cursor: pointer; backdrop-filter: blur(8px); font-weight: bold;">← MENU</button>
    </div>

    <canvas id="game"></canvas>

    <!-- ============ TITLE ============ -->
    <section id="screen-title" class="screen active">
        <div class="titleCard paperCard">
            <h1 id="titleName">INKWASH</h1>
            <div id="titleZh">晕染</div>
            <p id="tagline"></p>
            <input id="nickname" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Your Name">
            <button id="btnPlay" class="big primary">PLAY LOCAL</button>
            <button id="btnFriends" class="big">ONLINE MULTIPLAYER</button>
            <div class="titleFoot">
                <button id="btnSkins" class="mini">SKINS</button>
                <button id="btnHow" class="mini">HOW TO PLAY</button>
                <button id="btnLang" class="mini">中 / EN</button>
            </div>
            <div id="titleStats" class="tiny"></div>
        </div>
    </section>

    <!-- ============ FRIENDS (invite / join) ============ -->
    <section id="screen-friends" class="screen">
        <div class="panel paperCard">
            <h2 id="frTitle">Online Room</h2>
            <button id="btnHost" class="big primary">Create Room</button>
            <div class="orRow" id="frOr">OR</div>
            <input id="joinCode" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Room Code">
            <button id="btnJoinGo" class="big">Join Room</button>
            <div id="frStatus" class="tiny"></div>
            <button id="btnFrBack" class="mini">Back</button>
        </div>
    </section>

    <!-- ============ ROOM LOBBY (friends mode) ============ -->
    <section id="screen-room" class="screen">
        <div class="panel paperCard">
            <h2><span id="roomLabel">Room</span> <b id="roomCode">····</b></h2>
            <p id="shareHint" class="tiny"></p>
            <button id="btnCopyLink" class="big primary">Copy Invite Link</button>
            <div id="roomSeats" class="seatGrid"></div>
            <button id="btnRoomGo" class="big go">START MATCH</button>
            <div id="roomStatus" class="tiny"></div>
            <button id="btnRoomBack" class="mini">Leave Room</button>
        </div>
    </section>

    <!-- ============ SKINS ============ -->
    <section id="screen-skins" class="screen">
        <div class="panel paperCard">
            <h2 id="skTitle">Brush & Ink Skins</h2>
            <div id="skinGrid" class="skinGrid"></div>
            <button id="btnSkBack" class="mini">Back</button>
        </div>
    </section>

    <!-- ============ HOW TO ============ -->
    <section id="screen-how" class="screen">
        <div class="panel paperCard">
            <h2 id="howTitle">How to Play</h2>
            <ol id="howList"></ol>
            <button id="btnHowBack" class="mini">Back</button>
        </div>
    </section>

    <!-- ============ HUD ============ -->
    <div id="hud" class="hidden">
        <div id="hudTop">
            <div id="hudTimer" class="paperChip">3:00</div>
            <div id="hudBoard" class="paperChip"></div>
            <canvas id="minimap" width="140" height="140"></canvas>
        </div>
        <div id="announce"></div>
        <div id="tutor"></div>
        <div id="netBadge" class="paperChip hidden"></div>
        <div id="spectate" class="paperChip hidden"></div>
        <div id="frenzyBanner" class="hidden"></div>
    </div>

    <!-- ============ PODIUM ============ -->
    <section id="screen-podium" class="screen">
        <div class="panel paperCard podium">
            <div id="podiumSplash"></div>
            <h2 id="podTitle">Match Results</h2>
            <div id="podiumList"></div>
            <div id="podYou" class="tiny"></div>
            <div id="podNext" class="tiny"></div>
        </div>
    </section>
</div>

<script>
    // Navigation back to GameDevJS Hub
    document.getElementById('hub-back-btn')?.addEventListener('click', () => {
        window.parent.postMessage('backToMenu', '*');
        if (window === window.top) {
            window.location.href = '../index.html';
        }
    });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
